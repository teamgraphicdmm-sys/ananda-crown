<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 - Page Not Found | Ananda Crown</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" href="/favicon-32x32.png" sizes="32x32" type="image/png" />
  <link rel="icon" href="/favicon-16x16.png" sizes="16x16" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" type="image/png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0e0703;
      color: #f7f2ed;
      font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .logo-wrap {
      margin-bottom: 2rem;
    }
    .logo-img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }
    .subtitle {
      font-size: 11px;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #c2a180;
      font-weight: 600;
      margin-bottom: 1rem;
    }
    .code {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: clamp(4.5rem, 12vw, 7.5rem);
      font-weight: 300;
      line-height: 1;
      color: #ffffff;
      margin-bottom: 1.25rem;
      letter-spacing: 0.04em;
    }
    .desc {
      font-size: clamp(12px, 1.4vw, 14px);
      line-height: 1.7;
      color: rgba(247, 242, 237, 0.65);
      max-width: 28em;
      margin: 0 auto 2.25rem;
      font-weight: 400;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.35);
      padding: 14px 34px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: #ffffff;
      text-decoration: none;
      transition: all 0.3s ease;
      background: transparent;
    }
    .btn:hover {
      background-color: #c2a180;
      border-color: #c2a180;
      color: #120902;
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(194, 161, 128, 0.25);
    }
  </style>
</head>
<body>
  <div class="logo-wrap">
    <a href="/"><img src="/images/logo.jpg" alt="Ananda Crown" class="logo-img" /></a>
  </div>
  <p class="subtitle">Page Not Found</p>
  <h1 class="code">404</h1>
  <p class="desc">The page you are looking for does not exist, has been removed, or is temporarily unavailable.</p>
  <a href="/" class="btn">Back to Home</a>
</body>
</html>
