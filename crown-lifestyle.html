  <script>
    (function () {
      var section = document.querySelector('.crown-section');
      var art = section.querySelector('.art-svg');
      var crown = section.querySelector('.crown-rise');
      var narrow = matchMedia('(max-width: 1024px)');
      function frameArt() {
        art.setAttribute('viewBox', narrow.matches ? '1000 -360 842 1214' : '0 0 1842 854');
      }
      frameArt();
      narrow.addEventListener('change', function () {
        frameArt();
        if (window.ScrollTrigger) ScrollTrigger.refresh();
      });
      if (!window.gsap || !window.ScrollTrigger) {
        document.documentElement.classList.remove('motion-ready');
        return;
      }
      gsap.registerPlugin(ScrollTrigger);
      var construction = window.createCrownConstruction(crown);
      gsap.matchMedia().add('(prefers-reduced-motion: no-preference)', function () {
        var wipe = section.querySelector('.line-wipe');
        gsap.set(wipe, { x: -2000 });
        construction.reset();
        var scene = gsap.timeline({
          defaults: { ease: 'none' },
          scrollTrigger: {
            id: 'crown-rise', trigger: section, start: 'top top',
            end: function () { return '+=' + Math.round(innerHeight * (narrow.matches ? 1.3 : 1.6)); },
            pin: true, scrub: 1.1, anticipatePin: 1, invalidateOnRefresh: true
          }
        });
        // Reveal the gold curves, then construct and finish the crown from the foundation upward.
        scene.fromTo(wipe, { x: -2000 }, { x: 0, duration: 2.2, ease: 'sine.inOut', immediateRender: false }, 0);
        construction.animate(scene, 1.388178);
      });
    })();
